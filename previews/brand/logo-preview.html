<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>stayCube Logo</title>
<style>
:root{--ink:#0b1f44;--blue:#176be8;--mute:#586b80;--line:#e3e9f0}
body{margin:0;background:#eef2f6;font-family:-apple-system,"PingFang SC",sans-serif;color:var(--ink)}
.sheet{width:1400px;padding:56px;box-sizing:border-box;display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.c{background:#fff;border-radius:28px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lab{position:absolute;left:28px;top:24px;font-size:15px;letter-spacing:2px;color:#8a99ab;text-transform:uppercase}
.d .lab{color:#6f86a8}
.hero{grid-column:span 5;height:520px}.hero img{width:380px}
.lock{grid-column:span 7;height:520px}
.d{background:var(--ink)}
.lk{display:flex;align-items:center;gap:30px}
.lk img{width:250px;margin:-40px -30px -40px -40px}
.wm{font-family:"Avenir Next","Helvetica Neue",sans-serif;font-weight:500;font-size:104px;letter-spacing:-3px;line-height:1;color:var(--ink)}
.wm b{font-weight:500;color:var(--blue)}
.tag{margin-top:16px;font-size:24px;font-weight:400;letter-spacing:11.2px;color:var(--mute)}
.d .wm{color:#fff}.d .wm b{color:#4d93ff}.d .tag{color:#9fb3cf}
.row{grid-column:span 4;height:300px}
.app{width:180px;height:180px;border-radius:40px;background:linear-gradient(160deg,#1d74f0,#0f58c9);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(23,107,232,.28)}
.app img{width:150px}
.app.w{background:#fff;box-shadow:0 10px 30px rgba(11,31,68,.12),0 0 0 1px var(--line)}
.sizes{display:flex;align-items:flex-end;gap:36px}
.sizes img{display:block}
</style></head><body><div class="sheet">
<div class="c hero"><span class="lab">Mark</span><img src="staycube-mark.svg"></div>
<div class="c lock"><span class="lab">Lockup</span><div class="lk"><img src="staycube-mark.svg"><div><div class="wm">stay<b>Cube</b></div><div class="tag">旅宿模块化数字服务平台</div></div></div></div>
<div class="c hero d"><span class="lab">Mark · Dark</span><img src="staycube-mark-dark.svg"></div>
<div class="c lock d"><span class="lab">Lockup · Dark</span><div class="lk"><img src="staycube-mark-dark.svg"><div><div class="wm">stay<b>Cube</b></div><div class="tag">旅宿模块化数字服务平台</div></div></div></div>
<div class="c row"><span class="lab">App icon</span><div style="display:flex;gap:28px"><div class="app w"><img src="staycube-mark.svg"></div><div class="app"><img src="staycube-mark-white.svg"></div></div></div>
<div class="c row"><span class="lab">Small sizes</span><div class="sizes"><img src="staycube-mark.svg" width="128"><img src="staycube-mark.svg" width="64"><img src="staycube-mark.svg" width="40"><img src="staycube-mark.svg" width="24"></div></div>
<div class="c row"><span class="lab">Colour</span><div style="display:flex;gap:18px;font-size:15px;color:var(--mute);text-align:center"><div><div style="width:110px;height:110px;border-radius:20px;background:#0b1f44"></div><p>Ink<br>#0B1F44</p></div><div><div style="width:110px;height:110px;border-radius:20px;background:#176be8"></div><p>Cube Blue<br>#176BE8</p></div><div><div style="width:110px;height:110px;border-radius:20px;background:#f7f9fc;box-shadow:inset 0 0 0 1px #e3e9f0"></div><p>Mist<br>#F7F9FC</p></div></div></div>
</div></body></html>
