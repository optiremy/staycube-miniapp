<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>分享图预览</title>
<style>
  html,body{margin:0;background:#f7f9fc}
  .card{width:1000px;height:800px;box-sizing:border-box;padding:84px 88px;background:#f7f9fc;font-family:-apple-system,"PingFang SC",sans-serif;color:#0b1f44;position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;right:-160px;bottom:-160px;width:520px;height:520px;border-radius:50%;background:#176be8;opacity:.08}
  .logo{height:120px;display:block}
  h1{margin:72px 0 0;font-size:92px;font-weight:700;letter-spacing:2px;line-height:1.1}
  p{margin:20px 0 0;font-size:38px;color:#586b80}
  .tags{margin-top:64px;display:flex;gap:20px}
  .tag{padding:20px 30px;border-radius:20px;background:#fff;border:2px solid #d7e2ec;font-size:34px;font-weight:600}
  .tag b{color:#176be8;margin-right:10px}
</style></head><body>
<div class="card">
  <img class="logo" src="../miniprogram/assets/sifang-blue.png" alt="">
  <h1>自助服务</h1>
  <p>Self-service</p>
  <div class="tags">
    <div class="tag"><b>›</b>自助入住登记</div>
    <div class="tag"><b>›</b>行李寄存</div>
    <div class="tag"><b>›</b>预抵问卷</div>
  </div>
</div>
</body></html>
